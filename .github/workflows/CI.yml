name: Build SmartTube Hero

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-hero-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Configure Build Signing
        run: |
          echo "storePassword=smarttubehero" > keystore.properties
          echo "keyAlias=hero" >> keystore.properties
          echo "keyPassword=smarttubehero" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/hero/hero.jks" >> keystore.properties

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleStbetaRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp ./smarttubetv/build/outputs/apk/stbeta/release/*_arm64-v8a.apk out/SmartTubeHero_arm64-v8a.apk
          cp ./smarttubetv/build/outputs/apk/stbeta/release/*_armeabi-v7a.apk out/SmartTubeHero_armeabi-v7a.apk
          cp ./smarttubetv/build/outputs/apk/stbeta/release/*_universal.apk out/SmartTubeHero_universal.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartTubeHero_${{ steps.get_version.outputs.VERSION_NAME }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SmartTube Hero ${{ steps.get_version.outputs.VERSION_NAME }}
          body: "Build automatica ${{ steps.get_version.outputs.VERSION_NAME }}. Per la Nvidia Shield scarica SmartTubeHero_arm64-v8a.apk"
          prerelease: false
          make_latest: true
          files: out/*.apk
